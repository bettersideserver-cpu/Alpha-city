<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebP Scroll Sequence</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
    }

    /* Makes enough scroll space for the animation */
    .scroll-section {
      height: 500vh;
    }

    canvas {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      display: block;
    }
  </style>
</head>

<body>

  <div class="scroll-section"></div>

  <canvas id="canvas"></canvas>


  <script>

    // ==========================================
    // SETTINGS
    // ==========================================

    const FRAME_COUNT = 210;

    const FRAME_FOLDER = "sequence";


    // ==========================================
    // CANVAS
    // ==========================================

    const canvas = document.getElementById("canvas");

    const ctx = canvas.getContext("2d");


    function resizeCanvas() {

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      drawFrame(currentFrame);

    }


    window.addEventListener("resize", resizeCanvas);


    // ==========================================
    // LOAD IMAGES
    // ==========================================

    const images = [];

    let loaded = 0;


    for (let i = 0; i < FRAME_COUNT; i++) {

      const img = new Image();

      img.src =
        `${String(i).padStart(3, "0")}.webp`;

      img.onload = () => {

        loaded++;

        if (i === 0) {
          drawFrame(0);
        }

      };

      images[i] = img;
    }


    // ==========================================
    // CURRENT FRAME
    // ==========================================

    let currentFrame = 0;


    // ==========================================
    // DRAW FRAME
    // ==========================================

    function drawFrame(frame) {

      const img = images[frame];

      if (!img || !img.complete || !img.naturalWidth) {
        return;
      }


      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      // COVER IMAGE
      // Keeps aspect ratio and fills screen.

      const scale = Math.max(

        canvas.width / img.naturalWidth,

        canvas.height / img.naturalHeight

      );


      const width =
        img.naturalWidth * scale;

      const height =
        img.naturalHeight * scale;


      const x =
        (canvas.width - width) / 2;

      const y =
        (canvas.height - height) / 2;


      ctx.drawImage(
        img,
        x,
        y,
        width,
        height
      );
    }


    // ==========================================
    // SCROLL → FRAME
    // ==========================================

    function updateFrame() {

      const scrollTop =
        window.scrollY;

      const maxScroll =
        document.documentElement.scrollHeight -
        window.innerHeight;


      const progress =
        scrollTop / maxScroll;


      const frame =
        Math.floor(
          progress * (FRAME_COUNT - 1)
        );


      if (frame !== currentFrame) {

        currentFrame = frame;

        drawFrame(currentFrame);

      }
    }


    // ==========================================
    // SMOOTH SCROLL FRAME UPDATE
    // ==========================================

    let ticking = false;


    window.addEventListener(
      "scroll",
      () => {

        if (!ticking) {

          requestAnimationFrame(() => {

            updateFrame();

            ticking = false;

          });

          ticking = true;
        }

      },
      {
        passive: true
      }
    );


    // ==========================================
    // START
    // ==========================================

    resizeCanvas();

    updateFrame();

  </script>

</body>
</html>
